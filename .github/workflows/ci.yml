name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version is read from package.json "packageManager" field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint (type check)
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Format check
        run: pnpm run format:check
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # Sentry Source Map Upload
  # ──────────────────────────────────────────────────────────────────
  # Uncomment this job when deploying to production.
  #
  # Required GitHub Secrets:
  #   SENTRY_AUTH_TOKEN  - Create at https://sentry.io/settings/auth-tokens/
  #                        Scopes needed: project:releases, org:read
  #   SENTRY_ORG        - Your Sentry organization slug
  #   SENTRY_PROJECT    - Your Sentry project slug (e.g. "quickconv-web")
  #
  # sentry-source-maps:
  #   runs-on: ubuntu-latest
  #   needs: lint-and-build
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: "pnpm"
  #     - run: pnpm install --frozen-lockfile
  #     - name: Build with source maps
  #       run: cd apps/web && pnpm build
  #     - name: Upload source maps to Sentry
  #       env:
  #         SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  #         SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  #         SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  #       run: |
  #         cd apps/web
  #         RELEASE="quickconv-web@$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)"
  #         npx @sentry/cli releases new "$RELEASE"
  #         npx @sentry/cli releases files "$RELEASE" upload-sourcemaps .next/static --url-prefix "~/_next/static"
  #         npx @sentry/cli releases finalize "$RELEASE"
  #     - name: Remove source maps from deploy artifacts
  #       run: find apps/web/.next -name "*.map" -delete

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version is read from package.json "packageManager" field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: cd apps/api && pnpm test -- --coverage --coverage.provider=v8 --coverage.reporter=lcov
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/api/coverage/lcov.info
          flags: api-tests
          fail_ci_if_error: false

  # ── Stage 2: Staging Deploy ──────────────────────────────────────
  deploy-stg:
    runs-on: ubuntu-latest
    needs: [lint-and-build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build web for staging
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_API_URL: https://api-staging.quickconv.cc
          NEXT_PUBLIC_SITE_URL: https://staging.quickconv.cc
        run: pnpm run build --filter=@quickconv/web
      - name: Deploy Pages to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/web/out --project-name quickconv-web --branch staging
      - name: Deploy API to Workers (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd apps/api && npx wrangler deploy --env staging

  # ── Stage 3: Staging E2E ───────────────────────────────────────
  e2e-stg:
    runs-on: ubuntu-latest
    needs: deploy-stg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Generate auth-state.json via test auth endpoint
        env:
          E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
        run: |
          RESPONSE=$(curl -sf --retry 3 -X POST "https://api-staging.quickconv.cc/api/test/token" \
            -H "Content-Type: application/json" \
            -H "X-E2E-Secret: ${E2E_TEST_SECRET}" \
            -d '{"email":"e2e+staging@quickconv.cc","plan":"free"}') || { echo "::error::Failed to fetch E2E token"; exit 1; }
          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::E2E token is empty or null"
            exit 1
          fi
          cat > apps/web/e2e/auth-state.json << AUTHEOF
          {
            "cookies": [{
              "name": "qc_auth",
              "value": "${TOKEN}",
              "domain": "api-staging.quickconv.cc",
              "path": "/",
              "expires": -1,
              "httpOnly": true,
              "secure": true,
              "sameSite": "None"
            }],
            "origins": []
          }
          AUTHEOF
      - name: Run staging E2E tests
        env:
          E2E_TARGET: staging
          E2E_BASE_URL: https://staging.quickconv.cc
          NEXT_PUBLIC_API_URL: https://api-staging.quickconv.cc
        working-directory: apps/web
        run: npx playwright test --project=production e2e/stripe-e2e.spec.ts --reporter=github
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-stg-results
          path: apps/web/test-results/
          retention-days: 7

  # ── Stage 4: Production Deploy (gated by staging E2E) ──────────
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e-stg
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build web
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_API_URL: https://api.quickconv.cc
          NEXT_PUBLIC_SITE_URL: https://quickconv.cc
        run: pnpm run build --filter=@quickconv/web
      - name: Deploy Pages to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/web/out --project-name quickconv-web
      - name: Deploy API to Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd apps/api && npx wrangler deploy

  # ── Stage 5: Production E2E ────────────────────────────────────
  e2e-prod:
    runs-on: ubuntu-latest
    needs: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Run E2E tests against production
        env:
          E2E_TARGET: production
          E2E_BASE_URL: https://quickconv.cc
          E2E_API_URL: https://api.quickconv.cc
          E2E_GOOGLE_EMAIL: ${{ secrets.E2E_GOOGLE_EMAIL }}
          E2E_GOOGLE_PASSWORD: ${{ secrets.E2E_GOOGLE_PASSWORD }}
        working-directory: apps/web
        run: npx playwright test --project=production e2e/deploy-check.spec.ts e2e/auth.spec.ts e2e/smoke.spec.ts e2e/freemium.spec.ts e2e/quality-preview.spec.ts --reporter=github
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-prod-results
          path: apps/web/test-results/
          retention-days: 7

  # ── Stage 6: Notify ────────────────────────────────────────────
  # 設計方針 (Issue #294):
  # - 全ステージの失敗を捕捉 (needs に全 job 列挙)
  # - notify job 自体は常に成功扱いにして「通知役自身が落ちる」事故を排除
  # - Pushover が失敗 or secrets 未設定なら GitHub Issue 起票でフォールバック
  notify:
    runs-on: ubuntu-latest
    needs: [lint-and-build, test, deploy-stg, e2e-stg, deploy-prod, e2e-prod]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Aggregate job results
        id: result
        env:
          R_LINT: ${{ needs.lint-and-build.result }}
          R_TEST: ${{ needs.test.result }}
          R_DEPLOY_STG: ${{ needs.deploy-stg.result }}
          R_E2E_STG: ${{ needs.e2e-stg.result }}
          R_DEPLOY_PROD: ${{ needs.deploy-prod.result }}
          R_E2E_PROD: ${{ needs.e2e-prod.result }}
        run: |
          FAILED=()
          [[ "$R_LINT" == "failure" ]] && FAILED+=("lint-and-build")
          [[ "$R_TEST" == "failure" ]] && FAILED+=("test")
          [[ "$R_DEPLOY_STG" == "failure" ]] && FAILED+=("deploy-stg")
          [[ "$R_E2E_STG" == "failure" ]] && FAILED+=("e2e-stg")
          [[ "$R_DEPLOY_PROD" == "failure" ]] && FAILED+=("deploy-prod")
          [[ "$R_E2E_PROD" == "failure" ]] && FAILED+=("e2e-prod")

          if [[ ${#FAILED[@]} -eq 0 ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "failed_jobs=" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "failed_jobs=$(IFS=,; echo "${FAILED[*]}")" >> "$GITHUB_OUTPUT"
          fi
      - name: Build notification payload
        if: steps.result.outputs.status == 'FAIL'
        id: payload
        env:
          FAILED_JOBS: ${{ steps.result.outputs.failed_jobs }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          COMMIT_TITLE=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          {
            echo "short_sha=${SHORT_SHA}"
            echo "commit_title=${COMMIT_TITLE}"
            echo "title=QuickConv CI FAIL ${FAILED_JOBS}"
            echo "url=https://github.com/${REPO}/actions/runs/${RUN_ID}"
            echo "msg<<EOF"
            echo "failed: ${FAILED_JOBS}"
            echo "SHA: ${SHORT_SHA} (${COMMIT_TITLE})"
            echo "Run: https://github.com/${REPO}/actions/runs/${RUN_ID}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Send Pushover notification
        if: steps.result.outputs.status == 'FAIL'
        id: pushover
        continue-on-error: true
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          TITLE: ${{ steps.payload.outputs.title }}
          MSG: ${{ steps.payload.outputs.msg }}
          URL: ${{ steps.payload.outputs.url }}
        run: |
          if [[ -z "$PUSHOVER_USER_KEY" || -z "$PUSHOVER_API_TOKEN" ]]; then
            echo "::warning::PUSHOVER_USER_KEY or PUSHOVER_API_TOKEN is not set in repository secrets"
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /tmp/pushover_resp.txt -w "%{http_code}" \
            -X POST "https://api.pushover.net/1/messages.json" \
            --data-urlencode "token=${PUSHOVER_API_TOKEN}" \
            --data-urlencode "user=${PUSHOVER_USER_KEY}" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "message=${MSG}" \
            --data-urlencode "url=${URL}" \
            --data-urlencode "url_title=View Run" \
            --data-urlencode "priority=1")
          echo "Pushover HTTP ${HTTP_CODE}"
          cat /tmp/pushover_resp.txt || true
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning::Pushover API returned HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "Pushover notification sent successfully"
      - name: Fallback to GitHub Issue
        if: steps.result.outputs.status == 'FAIL' && steps.pushover.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FAILED_JOBS: ${{ steps.result.outputs.failed_jobs }}
          SHORT_SHA: ${{ steps.payload.outputs.short_sha }}
          COMMIT_TITLE: ${{ steps.payload.outputs.commit_title }}
          RUN_URL: ${{ steps.payload.outputs.url }}
        run: |
          TITLE="[ci-fail] CI failure on main: ${FAILED_JOBS} (${SHORT_SHA})"
          EXISTING=$(gh issue list --repo "$REPO" --label ci-failure --state open \
            --search "${SHORT_SHA} in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            echo "Issue #${EXISTING} already exists for SHA ${SHORT_SHA}, skipping"
            exit 0
          fi
          gh label create ci-failure --repo "$REPO" \
            --color d73a4a --description "Auto-created when CI fails on main" \
            2>/dev/null || true
          BODY_FILE=$(mktemp)
          {
            printf '%s\n\n' "Pushover 通知が失敗または secrets 未設定のため、自動起票しました。"
            printf '%s `%s`\n' "**Failed jobs**:" "${FAILED_JOBS}"
            printf '%s %s — %s\n' "**Commit**:" "${SHORT_SHA}" "${COMMIT_TITLE}"
            printf '%s %s\n\n' "**Run**:" "${RUN_URL}"
            printf '%s\n' "通知を有効化するには Repository Settings → Secrets and variables → Actions に \`PUSHOVER_USER_KEY\` / \`PUSHOVER_API_TOKEN\` を登録してください。手順は \`docs/deploy.md\` を参照。"
          } > "$BODY_FILE"
          gh issue create --repo "$REPO" \
            --title "$TITLE" \
            --label ci-failure \
            --body-file "$BODY_FILE"
