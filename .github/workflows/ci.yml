name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version is read from package.json "packageManager" field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint (type check)
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Format check
        run: pnpm run format:check
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # Sentry Source Map Upload
  # ──────────────────────────────────────────────────────────────────
  # Uncomment this job when deploying to production.
  #
  # Required GitHub Secrets:
  #   SENTRY_AUTH_TOKEN  - Create at https://sentry.io/settings/auth-tokens/
  #                        Scopes needed: project:releases, org:read
  #   SENTRY_ORG        - Your Sentry organization slug
  #   SENTRY_PROJECT    - Your Sentry project slug (e.g. "quickconv-web")
  #
  # sentry-source-maps:
  #   runs-on: ubuntu-latest
  #   needs: lint-and-build
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: "pnpm"
  #     - run: pnpm install --frozen-lockfile
  #     - name: Build with source maps
  #       run: cd apps/web && pnpm build
  #     - name: Upload source maps to Sentry
  #       env:
  #         SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  #         SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  #         SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  #       run: |
  #         cd apps/web
  #         RELEASE="quickconv-web@$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)"
  #         npx @sentry/cli releases new "$RELEASE"
  #         npx @sentry/cli releases files "$RELEASE" upload-sourcemaps .next/static --url-prefix "~/_next/static"
  #         npx @sentry/cli releases finalize "$RELEASE"
  #     - name: Remove source maps from deploy artifacts
  #       run: find apps/web/.next -name "*.map" -delete

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version is read from package.json "packageManager" field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: cd apps/api && pnpm test

  deploy-web:
    runs-on: ubuntu-latest
    needs: [lint-and-build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build web
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_API_URL: https://api.quickconv.cc
          NEXT_PUBLIC_SITE_URL: https://quickconv.cc
        run: pnpm run build --filter=@quickconv/web
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/web/out --project-name quickconv-web

  e2e:
    if: false
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version is read from package.json "packageManager" field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd apps/web && pnpm run test:e2e
