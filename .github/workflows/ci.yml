name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version is read from package.json "packageManager" field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint (type check)
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Format check
        run: pnpm run format:check
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # Sentry Source Map Upload
  # ──────────────────────────────────────────────────────────────────
  # Uncomment this job when deploying to production.
  #
  # Required GitHub Secrets:
  #   SENTRY_AUTH_TOKEN  - Create at https://sentry.io/settings/auth-tokens/
  #                        Scopes needed: project:releases, org:read
  #   SENTRY_ORG        - Your Sentry organization slug
  #   SENTRY_PROJECT    - Your Sentry project slug (e.g. "quickconv-web")
  #
  # sentry-source-maps:
  #   runs-on: ubuntu-latest
  #   needs: lint-and-build
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: "pnpm"
  #     - run: pnpm install --frozen-lockfile
  #     - name: Build with source maps
  #       run: cd apps/web && pnpm build
  #     - name: Upload source maps to Sentry
  #       env:
  #         SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  #         SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  #         SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  #       run: |
  #         cd apps/web
  #         RELEASE="quickconv-web@$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)"
  #         npx @sentry/cli releases new "$RELEASE"
  #         npx @sentry/cli releases files "$RELEASE" upload-sourcemaps .next/static --url-prefix "~/_next/static"
  #         npx @sentry/cli releases finalize "$RELEASE"
  #     - name: Remove source maps from deploy artifacts
  #       run: find apps/web/.next -name "*.map" -delete

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version is read from package.json "packageManager" field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: cd apps/api && pnpm test

  # ── Stage 2: Staging Deploy ──────────────────────────────────────
  deploy-stg:
    runs-on: ubuntu-latest
    needs: [lint-and-build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build web for staging
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_API_URL: https://api-staging.quickconv.cc
          NEXT_PUBLIC_SITE_URL: https://staging.quickconv.cc
        run: pnpm run build --filter=@quickconv/web
      - name: Deploy Pages to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/web/out --project-name quickconv-web --branch staging
      - name: Deploy API to Workers (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd apps/api && npx wrangler deploy --env staging

  # ── Stage 3: Staging E2E ───────────────────────────────────────
  e2e-stg:
    runs-on: ubuntu-latest
    needs: deploy-stg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Generate auth-state.json via test auth endpoint
        env:
          E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
        run: |
          RESPONSE=$(curl -sf --retry 3 -X POST "https://api-staging.quickconv.cc/api/test/token" \
            -H "Content-Type: application/json" \
            -H "X-E2E-Secret: ${E2E_TEST_SECRET}" \
            -d '{"email":"proce55ingpurser@gmail.com","plan":"free"}') || { echo "::error::Failed to fetch E2E token"; exit 1; }
          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::E2E token is empty or null"
            exit 1
          fi
          cat > apps/web/e2e/auth-state.json << AUTHEOF
          {
            "cookies": [{
              "name": "qc_auth",
              "value": "${TOKEN}",
              "domain": "api-staging.quickconv.cc",
              "path": "/",
              "expires": -1,
              "httpOnly": true,
              "secure": true,
              "sameSite": "None"
            }],
            "origins": []
          }
          AUTHEOF
      - name: Run staging E2E tests
        env:
          E2E_TARGET: staging
          E2E_BASE_URL: https://staging.quickconv.cc
          NEXT_PUBLIC_API_URL: https://api-staging.quickconv.cc
        working-directory: apps/web
        run: npx playwright test --project=production e2e/stripe-e2e.spec.ts --reporter=github
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-stg-results
          path: apps/web/test-results/
          retention-days: 7

  # ── Stage 4: Production Deploy (gated by staging E2E) ──────────
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e-stg
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build web
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_API_URL: https://api.quickconv.cc
          NEXT_PUBLIC_SITE_URL: https://quickconv.cc
        run: pnpm run build --filter=@quickconv/web
      - name: Deploy Pages to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/web/out --project-name quickconv-web
      - name: Deploy API to Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd apps/api && npx wrangler deploy

  # ── Stage 5: Production E2E ────────────────────────────────────
  e2e-prod:
    runs-on: ubuntu-latest
    needs: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install --with-deps chromium
      - name: Run E2E tests against production
        env:
          E2E_TARGET: production
          E2E_BASE_URL: https://quickconv.cc
          E2E_API_URL: https://api.quickconv.cc
          E2E_GOOGLE_EMAIL: ${{ secrets.E2E_GOOGLE_EMAIL }}
          E2E_GOOGLE_PASSWORD: ${{ secrets.E2E_GOOGLE_PASSWORD }}
        working-directory: apps/web
        run: npx playwright test --project=production e2e/deploy-check.spec.ts e2e/auth.spec.ts e2e/smoke.spec.ts e2e/freemium.spec.ts e2e/quality-preview.spec.ts --reporter=github
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-prod-results
          path: apps/web/test-results/
          retention-days: 7

  # ── Stage 6: Notify ────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [e2e-stg, deploy-prod, e2e-prod]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Determine result
        id: result
        run: |
          if [[ "${{ needs.e2e-stg.result }}" == "failure" ]]; then
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "message=Staging E2E failed — production deploy was blocked" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.deploy-prod.result }}" == "failure" ]]; then
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "message=Production deploy failed" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.e2e-prod.result }}" == "failure" ]]; then
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "message=Production E2E failed — deployed code may have issues" >> "$GITHUB_OUTPUT"
          else
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "message=All stages passed" >> "$GITHUB_OUTPUT"
          fi
      - name: Send Pushover notification on failure
        if: steps.result.outputs.status == 'FAIL'
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          curl -sf -X POST "https://api.pushover.net/1/messages.json" \
            -d "token=${PUSHOVER_API_TOKEN}" \
            -d "user=${PUSHOVER_USER_KEY}" \
            -d "title=QuickConv CI: ${{ steps.result.outputs.status }}" \
            -d "message=${{ steps.result.outputs.message }}" \
            -d "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "url_title=View Run" \
            -d "priority=1"
