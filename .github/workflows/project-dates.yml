name: Project Roadmap Date Automation

on:
  issues:
    types: [opened, edited, labeled]
  pull_request:
    types: [closed]
  projects_v2_item:
    types: [edited]

permissions:
  issues: read
  pull-requests: read
  repository-projects: write

jobs:
  # Issue が In Progress に移動 → Start date をセット
  set-start-date:
    runs-on: ubuntu-latest
    if: github.event_name == 'projects_v2_item' && github.event.changes.field_value.field_node_id != ''
    steps:
      - name: Check if status changed to In Progress
        id: check
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          # Get the field that changed
          FIELD_ID="${{ github.event.changes.field_value.field_node_id }}"
          # Status field ID
          STATUS_FIELD_ID="PVTSSF_lAHOAAnM1c4BRvU7zg_epRg"
          # In Progress option ID
          IN_PROGRESS_ID="47fc9ee4"

          if [ "$FIELD_ID" != "$STATUS_FIELD_ID" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_VALUE="${{ github.event.changes.field_value.to.optionId }}"
          if [ "$NEW_VALUE" != "$IN_PROGRESS_ID" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "item_id=${{ github.event.projects_v2_item.node_id }}" >> $GITHUB_OUTPUT

      - name: Set Start Date
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PROJECT_ID="PVT_kwHOAAnM1c4BRvU7"
          START_DATE_FIELD_ID="PVTF_lAHOAAnM1c4BRvU7zg_epUs"
          ITEM_ID="${{ steps.check.outputs.item_id }}"

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $date: Date!) {
              updateProjectV2ItemFieldValue(
                input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { date: $date }
                }
              ) {
                projectV2Item { id }
              }
            }
          ' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$START_DATE_FIELD_ID" -f date="$TODAY"

          echo "Set Start Date to $TODAY for item $ITEM_ID"

  # PR がマージ → 紐づく Issue の Target date をセット
  set-end-date:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    steps:
      - name: Get linked issues and set Target Date
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PROJECT_ID="PVT_kwHOAAnM1c4BRvU7"
          TARGET_DATE_FIELD_ID="PVTF_lAHOAAnM1c4BRvU7zg_epUw"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # Get linked issues from PR body (matches "Closes #XX", "Fixes #XX", "Resolves #XX")
          PR_BODY="${{ github.event.pull_request.body }}"
          ISSUE_NUMBERS=$(echo "$PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#[0-9]+' | grep -oE '[0-9]+' || true)

          # Also check PR linked issues via API
          API_ISSUES=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body' | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#[0-9]+' | grep -oE '[0-9]+' || true)

          ALL_ISSUES=$(echo -e "$ISSUE_NUMBERS\n$API_ISSUES" | sort -u | grep -v '^$' || true)

          if [ -z "$ALL_ISSUES" ]; then
            echo "No linked issues found"
            exit 0
          fi

          for ISSUE_NUM in $ALL_ISSUES; do
            echo "Processing issue #$ISSUE_NUM"

            # Get the issue node ID
            ISSUE_NODE_ID=$(gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.node_id')

            # Find the project item for this issue
            ITEM_ID=$(gh api graphql -f query='
              query($nodeId: ID!) {
                node(id: $nodeId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            ' -f nodeId="$ISSUE_NODE_ID" --jq ".data.node.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id" 2>/dev/null || true)

            if [ -z "$ITEM_ID" ]; then
              echo "Issue #$ISSUE_NUM not found in project"
              continue
            fi

            # Set Target Date
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $date: Date!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { date: $date }
                  }
                ) {
                  projectV2Item { id }
                }
              }
            ' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$TARGET_DATE_FIELD_ID" -f date="$TODAY"

            echo "Set Target Date to $TODAY for issue #$ISSUE_NUM"

            # Also set status to Done
            STATUS_FIELD_ID="PVTSSF_lAHOAAnM1c4BRvU7zg_epRg"
            DONE_OPTION_ID="98236657"

            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }
            ' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" -f fieldId="$STATUS_FIELD_ID" -f optionId="$DONE_OPTION_ID"

            echo "Set status to Done for issue #$ISSUE_NUM"
          done
