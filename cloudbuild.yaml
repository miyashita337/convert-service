steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/quickconv-489717/quickconv/converter'
      - '-f'
      - 'apps/converter/Dockerfile'
      - '.'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'quickconv-converter'
      - '--image=us-central1-docker.pkg.dev/quickconv-489717/quickconv/converter'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--timeout=500'
      - '--max-instances=1'
images:
  - 'us-central1-docker.pkg.dev/quickconv-489717/quickconv/converter'
